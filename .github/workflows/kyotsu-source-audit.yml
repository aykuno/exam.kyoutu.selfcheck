name: Audit kyotsu PDF links and averages
on:
  push:
    branches: [audit/kyotsu-direct-20261004]
    paths: [.github/workflows/kyotsu-source-audit.yml]
permissions: {}
jobs:
  inspect:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install free browser library
        run: python3 -m pip install --quiet playwright
      - name: Inspect math subject page buttons
        shell: bash
        run: |
          python3 - <<'PY'
          import json,shutil
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              browser=pw.chromium.launch(executable_path=shutil.which('google-chrome') or shutil.which('chromium'),headless=True,args=['--no-sandbox'])
              page=browser.new_page()
              for filename in ['2025_数学I_本試験問題.pdf','2025_数学IA_本試験問題.pdf']:
                  from urllib.parse import quote
                  page.goto('https://kyotsu.org/test/'+quote(filename),wait_until='domcontentloaded',timeout=90000)
                  page.wait_for_selector('a[href*="r2.dev"]',timeout=90000)
                  print('MATH_SOURCE',json.dumps({'filename':filename,'text':page.locator('body').inner_text().split('試験情報')[-1],'links':page.locator('a[href*="r2.dev"]').evaluate_all('(els)=>els.map(e=>({text:e.innerText,href:e.href}))')},ensure_ascii=False),flush=True)
              browser.close()
          
          PY
