name: Audit kyotsu PDF links and averages
on:
  push:
    branches: [audit/kyotsu-direct-20261004]
    paths: [.github/workflows/kyotsu-source-audit.yml]
permissions: {}
jobs:
  inspect:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install free browser library
        run: python3 -m pip install --quiet playwright
      - name: Verify unavailable answers and final published PDF links
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,time,shutil,urllib.request
          from playwright.sync_api import sync_playwright
          site='https://aykuno.github.io/exam.kyoutu.selfcheck/'
          for attempt in range(15):
              with urllib.request.urlopen(site+'kyoutu-ui-lab/app.js?audit=final-20261004',timeout=60) as r:app=r.read().decode('utf-8')
              catalog=json.loads(re.sub(r',\s*}', '}',re.search(r'const SOURCE_LINK_CATALOG = (\{.*?\n  \});',app,re.S)[1]))
              if all(catalog['2001||center-main||'+s]['解答']==[] for s in ['物理IA','物理IB']):break
              time.sleep(10)
          else:raise Exception('Final deployment did not arrive')
          with sync_playwright() as pw:
              browser=pw.chromium.launch(executable_path=shutil.which('google-chrome'),headless=True,args=['--no-sandbox'])
              page=browser.new_page()
              errors=[]
              page.on('pageerror',lambda e:errors.append(str(e)))
              page.goto(site,wait_until='domcontentloaded',timeout=90000)
              page.wait_for_function("document.getElementById('yearSelect') && !document.getElementById('yearSelect').disabled",timeout=120000)
              results=[]
              for subject in ['物理IA','物理IB']:
                  page.select_option('#yearSelect','2001')
                  page.select_option('#examSelect','center-main')
                  page.select_option('#subjectSelect',subject)
                  links=page.locator('#sourceLinks').inner_text()
                  assert '解答（確認不能）' in links,(subject,links)
                  actual=page.locator('#sourceLinks a').evaluate_all('(els)=>els.map(e=>({text:e.innerText,href:e.href}))')
                  assert any(e['text']=='問題' and '.r2.dev/' in e['href'] for e in actual),actual
                  assert any(e['text']=='掲載ページ' and '/test/' in e['href'] for e in actual),actual
                  assert not any(e['text']=='解答' for e in actual),actual
                  results.append({'subject':subject,'text':links,'links':actual})
              page.select_option('#yearSelect','2024')
              page.select_option('#examSelect','main')
              page.select_option('#subjectSelect','国語')
              links=page.locator('#sourceLinks a').evaluate_all('(els)=>els.map(e=>({text:e.innerText,href:e.href}))')
              assert all('.r2.dev/' in e['href'] for e in links if e['text'] in ['問題','解答']),links
              print('FINAL_BROWSER',json.dumps({'unavailable':results,'example':links,'errors':errors},ensure_ascii=False),flush=True)
              assert not errors,errors
              browser.close()
          
          PY
