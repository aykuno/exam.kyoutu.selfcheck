name: Audit kyotsu PDF links and averages
on:
  push:
    branches: [audit/kyotsu-direct-20261004]
    paths: [.github/workflows/kyotsu-source-audit.yml]
permissions: {}
jobs:
  inspect:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install free browser library
        run: python3 -m pip install --quiet playwright
      - name: Open source page and inspect actual PDF buttons
        shell: bash
        run: |
          python3 - <<'PY'
          import json,shutil
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              browser=pw.chromium.launch(executable_path=shutil.which('google-chrome') or shutil.which('chromium'),headless=True,args=['--no-sandbox'])
              page=browser.new_page()
              page.goto('https://kyotsu.org/test/2024_%E5%9B%BD%E8%AA%9E_%E6%9C%AC%E8%A9%A6%E9%A8%93%E5%95%8F%E9%A1%8C.pdf',wait_until='domcontentloaded',timeout=90000)
              page.wait_for_selector('a[href*="r2.dev"]',timeout=90000)
              print('SOURCE_BROWSER',json.dumps({'url':page.url,'text':page.locator('body').inner_text(),'links':page.locator('a').evaluate_all('(els)=>els.map(e=>({text:e.innerText,href:e.href}))')},ensure_ascii=False),flush=True)
              browser.close()
          
          PY
