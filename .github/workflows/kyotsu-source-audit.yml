name: Inspect all published exam averages
on:
  push:
    branches: [audit/kyotsu-direct-20261004]
    paths: [.github/workflows/kyotsu-source-audit.yml]
permissions: {}
jobs:
  inspect:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install free browser library
        run: python3 -m pip install --quiet playwright
      - name: Verify every average on the public results screen
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time,urllib.request,shutil
          from playwright.sync_api import sync_playwright
          site='https://aykuno.github.io/exam.kyoutu.selfcheck/'
          def get(u):
              with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=90) as r:return r.read().decode('utf-8')
          for attempt in range(20):
              app=get(site+'kyoutu-ui-lab/app.js?check=all-averages')
              if 'const showAverage=' in app:break
              time.sleep(10)
          else:raise Exception('Updated display not deployed')
          keys=[k for k in json.loads(get(site+'answer_keys_verified.json'))['keys'] if k['exam'] in ['main','center-main','retake','center-retake']]
          stats=json.loads(get(site+'statistics_final.json'))['entries']
          with sync_playwright() as pw:
              browser=pw.chromium.launch(executable_path=shutil.which('google-chrome'),headless=True,args=['--no-sandbox'])
              page=browser.new_page(viewport={'width':390,'height':844})
              errors=[]
              page.on('pageerror',lambda e:errors.append(str(e)))
              page.goto(site,wait_until='domcontentloaded',timeout=90000)
              page.wait_for_function("document.getElementById('yearSelect') && !document.getElementById('yearSelect').disabled",timeout=120000)
              results=[]
              for start in range(0,len(keys),30):
                  batch=page.evaluate("""({keys,stats})=>{
                    const out=[];
                    const set=(id,value)=>{const e=document.getElementById(id);e.value=String(value);e.dispatchEvent(new Event('change'));if(e.value!==String(value))throw Error('Missing selector '+value)};
                    for(const k of keys){
                      document.getElementById('brandHome').click();
                      set('yearSelect',k.year);set('examSelect',k.exam);set('subjectSelect',k.subject);
                      document.getElementById('manualStartButton').click();
                      document.getElementById('methodManual').click();
                      window.grade();
                      const stat=stats.find(s=>String(s.year)===String(k.year)&&s.exam===k.exam&&s.subject===k.subject);
                      const expected=stat&&stat.averageScore!=null?Number(stat.averageScore).toFixed(2):'掲載元に記載なし';
                      const node=document.querySelector('#resultScreen .avgScoreMetric .avgValue');
                      if(!node||!node.checkVisibility()||node.innerText!==expected)throw Error(JSON.stringify({year:k.year,exam:k.exam,subject:k.subject,expected,actual:node?.innerText,visible:node?.checkVisibility()}));
                      out.push({year:String(k.year),exam:k.exam,subject:k.subject,value:node.innerText});
                    }
                    return out;
                  }""",{'keys':keys[start:start+30],'stats':stats})
                  results.extend(batch)
              assert not errors,errors
              numeric=[r for r in results if r['value']!='掲載元に記載なし']
              byyear={y:{'numeric':sum(r['year']==y and r['value']!='掲載元に記載なし' for r in results),'missing':sum(r['year']==y and r['value']=='掲載元に記載なし' for r in results)} for y in sorted(set(r['year'] for r in results))}
              print('ALL_AVERAGE_UI',json.dumps({'total':len(results),'numeric':len(numeric),'missing':len(results)-len(numeric),'years':byyear,'errors':errors},ensure_ascii=False),flush=True)
              print('AVERAGE_EXAMPLES',json.dumps([r for r in results if r['subject']=='国語' and r['year'] in ['2001','2024','2026']],ensure_ascii=False),flush=True)
              browser.close()
          
          PY
