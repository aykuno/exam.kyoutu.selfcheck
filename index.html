    .boot{max-width:720px;margin:48px auto;padding:20px;background:#fff;border:1px solid #d9deea;border-radius:16px;box-shadow:0 10px 24px rgba(22,34,64,.06)}

<body>
<div class="boot"><h1>読み込み中</h1><p>新しい採点画面を読み込んでいます。</p></div>
<script>
(function(){
  'use strict';

  function dncPdf(d,file,name){

  const DNC_R8_MAIN_ANSWERS = {

    '地理総合，地理探究':dncPdf(797,'abm00006031.pdf','R8_【地理総合，地理探究】発表用正解.pdf'),

    '歴史総合，世界史探究':dncPdf(797,'abm00006033.pdf','R8_【歴史総合，世界史探究】発表用正解.pdf'),
    '公共，倫理':dncPdf(797,'abm00006030.pdf','R8_【公共，倫理】発表用正解.pdf'),
    '公共，政治・経済':dncPdf(797,'abm00006034.pdf','R8_【公共，政治経済】発表用正解.pdf'),
    '地理総合':dncPdf(797,'abm00006029.pdf','R8_【地総／歴総／公共】発表用正解.pdf'),
    '歴史総合':dncPdf(797,'abm00006029.pdf','R8_【地総／歴総／公共】発表用正解.pdf'),
    '公共':dncPdf(797,'abm00006029.pdf','R8_【地総／歴総／公共】発表用正解.pdf'),
    '数学Ⅰ，数学A':dncPdf(797,'abm00006054.pdf','R8_【数学Ⅰ，数学A】発表用正解.pdf'),
    '数学Ⅰ':dncPdf(797,'abm00006053.pdf','R8_【数学Ⅰ】発表用正解.pdf'),
    '数学Ⅱ，数学B，数学C':dncPdf(797,'abm00006056.pdf','R8_【数学Ⅱ，数学B，数学C】発表用正解.pdf'),
    '物理基礎':dncPdf(797,'abm00006051.pdf','R8_【基礎科目】発表用正解.pdf'),
    '化学基礎':dncPdf(797,'abm00006051.pdf','R8_【基礎科目】発表用正解.pdf'),
    '生物基礎':dncPdf(797,'abm00006051.pdf','R8_【基礎科目】発表用正解.pdf'),
    '地学基礎':dncPdf(797,'abm00006051.pdf','R8_【基礎科目】発表用正解.pdf'),
    '物理':dncPdf(797,'abm00006049.pdf','R8_【物理】発表用正解.pdf'),
    '化学':dncPdf(797,'abm00006050.pdf','R8_【化学】発表用正解.pdf'),
    '生物':dncPdf(797,'abm00006047.pdf','R8_【生物】発表用正解.pdf'),
    '地学':dncPdf(797,'abm00006048.pdf','R8_【地学】発表用正解.pdf'),
    '英語（リーディング）':dncPdf(797,'abm00006039.pdf','R8_【英語（リーディング）】発表用正解.pdf'),
    '英語（リスニング）':dncPdf(797,'abm00006037.pdf','R8_【英語（リスニング）】発表用正解.pdf'),
    '情報Ⅰ':dncPdf(797,'abm00006055.pdf','R8_【情報Ⅰ】発表用正解.pdf')
  };

  const DNC_R8_RETAKE_ANSWERS = {
    '国語':dncPdf(798,'abm00006068.pdf','R8_追・再試験【国語】発表用正解.pdf'),
    '地理総合，地理探究':dncPdf(798,'abm00006070.pdf','R8_追・再試験【地理総合，地理探究】発表用正解.pdf'),
    '歴史総合，日本史探究':dncPdf(798,'abm00006069.pdf','R8_追・再試験【歴史総合，日本史探究】発表用正解.pdf'),
    '歴史総合，世界史探究':dncPdf(798,'abm00006071.pdf','R8_追・再試験【歴史総合，世界史探究】発表用正解.pdf'),
    '公共，倫理':dncPdf(798,'abm00006073.pdf','R8_追・再試験【公共，倫理】発表用正解.pdf'),
    '公共，政治・経済':dncPdf(798,'abm00006072.pdf','R8_追・再試験【公共，政治経済】発表用正解.pdf'),
    '地理総合':dncPdf(798,'abm00006074.pdf','R8_追・再試験【地総／歴総／公共】発表用正解.pdf'),
    '歴史総合':dncPdf(798,'abm00006074.pdf','R8_追・再試験【地総／歴総／公共】発表用正解.pdf'),
    '公共':dncPdf(798,'abm00006074.pdf','R8_追・再試験【地総／歴総／公共】発表用正解.pdf'),
    '数学Ⅰ，数学A':dncPdf(798,'abm00006096.pdf','R8_追・再試験【数学Ⅰ，数学A】発表用正解.pdf'),
    '数学Ⅰ':dncPdf(798,'abm00006097.pdf','R8_追・再試験【数学Ⅰ】発表用正解.pdf'),
    '数学Ⅱ，数学B，数学C':dncPdf(798,'abm00006098.pdf','R8_追・再試験【数学Ⅱ，数学B，数学C】発表用正解.pdf'),
    '物理基礎':dncPdf(798,'abm00006091.pdf','R8_追・再試験【基礎科目】発表用正解.pdf'),
    '化学基礎':dncPdf(798,'abm00006091.pdf','R8_追・再試験【基礎科目】発表用正解.pdf'),
    '生物基礎':dncPdf(798,'abm00006091.pdf','R8_追・再試験【基礎科目】発表用正解.pdf'),
    '地学基礎':dncPdf(798,'abm00006091.pdf','R8_追・再試験【基礎科目】発表用正解.pdf'),
    '物理':dncPdf(798,'abm00006092.pdf','R8_追・再試験【物理】発表用正解.pdf'),
    '化学':dncPdf(798,'abm00006093.pdf','R8_追・再試験【化学】発表用正解.pdf'),
    '生物':dncPdf(798,'abm00006094.pdf','R8_追・再試験【生物】発表用正解.pdf'),
    '地学':dncPdf(798,'abm00006095.pdf','R8_追・再試験【地学】発表用正解.pdf'),
    '英語（リーディング）':dncPdf(798,'abm00006083.pdf','R8_追・再試験【英語（リーディング）】発表用正解.pdf'),
    '英語（リスニング）':dncPdf(798,'abm00006079.pdf','R8追・再試験【英語（リスニング）】発表用正解.pdf'),
    '情報Ⅰ':dncPdf(798,'abm00006099.pdf','R8_追・再試験【情報Ⅰ】発表用正解.pdf')
  };

  function fail(message){
    document.body.innerHTML = '<pre style="white-space:pre-wrap;margin:20px;padding:16px;border-radius:12px;background:#0b1020;color:#e5e7eb">' + String(message).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) + '</pre>';
  }

  function replaceRequired(text, oldText, newText, label){
    if(!text.includes(oldText)) throw new Error(label + ' を見つけられませんでした。');
    return text.replace(oldText, newText);
  }

  function patchApp(app){
    app = replaceRequired(app,
`  const EXAM_LABELS = {
    main:'本試験',
    'mock-kawai-zento-2026-02':'第2回 河合全統共通テスト模試'
  };`,
`  const EXAM_LABELS = {
    main:'本試験',
    retake:'追試験・再試験',
    other:'試作問題',
    'center-main':'本試験（センター）',
    'center-retake':'追試験（センター）',
    'mock-benesse-2026-05':'模擬試験-2026年5月実施ベネッセ共通テスト模試',
    'mock-kawai-zento-2026-02':'模擬試験-第２回 河合全統共通テスト模試'
  };`,
      '試験区分表示定義');

    app = replaceRequired(app,
      "      if(!mainResponse.ok) throw new Error('2025年度本試験データを読み込めませんでした。');",
      "      if(!mainResponse.ok) throw new Error('正解データを読み込めませんでした。');",
      '正解データエラー表示');

    app = replaceRequired(app,
      "      const mainKeys=(mainObject.keys||[]).filter(k=>String(k.year)==='2025'&&k.exam==='main');",
      "      const mainKeys=(mainObject.keys||[]);",
      '本番データ範囲');

    const dncMainJson=JSON.stringify(DNC_R8_MAIN_ANSWERS);
    const dncRetakeJson=JSON.stringify(DNC_R8_RETAKE_ANSWERS);
    const oldMerge="      keys=[...mainKeys,...mockKeys].map(k=>normalizeKey(mergeSourceMetadata(k,sourceEntries)));";
    const newMerge=`      const dncR8Main=${dncMainJson};const dncR8Retake=${dncRetakeJson};keys=[...mainKeys,...mockKeys].map(k=>{const merged=mergeSourceMetadata(k,sourceEntries);if(merged.problemUrl&&merged.problemUrl.startsWith('${OLD_PROBLEM_PREFIX}'))merged.problemUrl='${NEW_PROBLEM_PREFIX}'+merged.problemUrl.slice('${OLD_PROBLEM_PREFIX}'.length);if(String(merged.year)==='2026'&&(merged.exam==='main'||merged.exam==='retake')){const dncMap=merged.exam==='main'?dncR8Main:dncR8Retake;const answer=dncMap[merged.subject];if(answer){merged.answerPdfUrl=answer;merged.sourceUrl=answer;}merged.sourcePageUrl=merged.exam==='main'?'${DNC_R8_MAIN_PAGE}':'${DNC_R8_RETAKE_PAGE}';merged.source='大学入試センター 令和8年度 '+(merged.exam==='main'?'本試験':'追・再試験')+'の正解';}return normalizeKey(merged);});`;
    app = replaceRequired(app,oldMerge,newMerge,'問題URL・大学入試センター正解リンク統合');

    return app;
  }

  function patchHtml(html, app){
    html = replaceRequired(html, '<head>', '<head>\n  <base href="./kyoutu-ui-lab/">', 'base要素');
    html = html.replace('<title>共通テスト・センター試験 自動採点｜UI検証版</title>', '<title>共通テスト・センター試験 自動採点</title>');
    html = html.replace('<span class="lab-badge">検証版</span>', '');
    html = html.replace('<p class="eyebrow">メインサイトとは別のUI検証版</p>', '<p class="eyebrow">共通テスト・センター試験 自動採点</p>');
    html = html.replace('</head>', '<style>.test-tools{display:none!important}</style>\n</head>');

    const loadError = '      <p class="load-error" id="loadError" hidden></p>';
    const userKeyCard = `      <section class="custom-compare-card">
        <div>
          <span class="custom-compare-label">自分で登録した正答データ</span>
          <h2>登録済みの自作データで採点</h2>
          <p>学校の小テスト・模試・自作問題など、自分で登録した正答データを使って採点します。</p>
        </div>
        <a class="secondary-action-button" href="../user-key-tool/" style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center">登録データで採点する</a>
      </section>
`;
    html = replaceRequired(html, loadError, userKeyCard + loadError, 'ユーザー登録データ導線');

    const appTag = '<script src="app.js?v=20260903-source-links2"></' + 'script>';
    const safeApp = app.replace(/<\/script/gi,'<\\/script');
    html = replaceRequired(html, appTag, '<script>' + safeApp + '</' + 'script>', 'app.js読込タグ');
    return html;
  }

  Promise.all([
    fetch(LAB_INDEX,{cache:'no-store'}),
    fetch(LAB_APP,{cache:'no-store'})
  ])
    .then(async ([htmlResponse,appResponse])=>{
      if(!htmlResponse.ok) throw new Error('新UI HTMLの読み込みに失敗しました: '+htmlResponse.status);
      if(!appResponse.ok) throw new Error('新UI JavaScriptの読み込みに失敗しました: '+appResponse.status);
      const html=await htmlResponse.text();
      const app=patchApp(await appResponse.text());
      return patchHtml(html,app);
    })
    .then(html=>{document.open();document.write(html);document.close();})
    .catch(error=>fail('メインサイトの読み込みに失敗しました。\n'+error.message));
})();
</script>
</body>
</html>
