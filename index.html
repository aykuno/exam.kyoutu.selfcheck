<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="googlebot" content="noindex,nofollow"><title>共通テスト・センター試験 自動採点</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:linear-gradient(135deg,#e8efff,#f8fafc 48%,#eef2f7);color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;padding:20px}.card{width:min(420px,100%);background:#fff;border:1px solid #d9deea;border-radius:22px;box-shadow:0 24px 60px rgba(30,58,138,.16);padding:28px}h1{margin:0 0 8px;font-size:24px;line-height:1.25}p{margin:0 0 20px;color:#647086;font-size:14px;line-height:1.7}.field{display:grid;gap:8px;margin-bottom:12px}label{font-size:13px;font-weight:800;color:#273449}input{display:block;width:100%;height:50px;border:1px solid #cfd7e6;border-radius:14px;padding:0 14px;font:inherit;font-size:18px;outline:none;background:#fff}input:focus{border-color:#2f5fd0;box-shadow:0 0 0 4px rgba(47,95,208,.14)}input.error{border-color:#b3261e;background:#fff7f6}button{display:block;width:100%;height:50px;border:0;border-radius:14px;background:#2f5fd0;color:#fff;font:inherit;font-weight:900;cursor:pointer}.msg{min-height:22px;margin-top:12px;color:#b3261e;font-size:13px;font-weight:800}.sub{margin-top:14px;color:#94a0b5;font-size:12px;text-align:center}
</style></head><body><main class="card"><h1>共通テスト・センター試験 自動採点</h1><p>パスワードを入力してください。</p><div class="field"><label for="pw">パスワード</label><input id="pw" type="password" autocomplete="current-password" autofocus></div><button id="go">開く</button><div id="msg" class="msg" aria-live="polite"></div><div class="sub">noindex設定済み</div></main><script>
const CORRECT_HASH='ccd518f25dc2badf6389310f65be325d2c125306fa8fb21d3fe1f34a9f837385';async function sha256(t){const b=new TextEncoder().encode(t);const h=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}async function openSite(){const input=document.getElementById('pw'),msg=document.getElementById('msg');const h=await sha256(input.value);if(h===CORRECT_HASH){location.href='./'+h+'/';return}msg.textContent='パスワードが間違っています。';input.classList.add('error');input.focus();input.select();}document.getElementById('go').onclick=openSite;document.getElementById('pw').addEventListener('input',e=>{e.currentTarget.classList.remove('error');document.getElementById('msg').textContent='';});document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')openSite()});
</script></body></html>
