<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>共通テスト・センター試験 自動採点</title>
  <style>
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:#f6f7fb;color:#1d2433}
    .boot{max-width:720px;margin:48px auto;padding:20px;background:white;border:1px solid #d9deea;border-radius:16px;box-shadow:0 10px 24px rgba(22,34,64,.06)}
  </style>
</head>
<body>
<div class="boot"><h1>読み込み中</h1><p>正解データを読み込んでいます。</p></div>
<script>
(function(){
  const CURRENT_WRAPPER_URL = 'https://raw.githubusercontent.com/aykuno/exam.kyoutu.selfcheck/53ef468d0f41d280f3429942bfdb5387d29cd73e/index.html';

  function fail(message){
    document.body.innerHTML = '<pre style="white-space:pre-wrap;margin:20px;padding:16px;border-radius:12px;background:#0b1020;color:#e5e7eb">' + message + '</pre>';
  }

  function replaceRequired(html, oldText, newText, label){
    if(!html.includes(oldText)) throw new Error(label + ' を見つけられませんでした。');
    return html.replace(oldText, newText);
  }

  function patchWrapper(html){
    html = replaceRequired(html,
`  const MOCK_EXAM_LABEL = '模擬試験-2026年5月実施ベネッセ共通テスト模試';
  const UPDATE_TIME_TEXT = '最終更新日時：2026/7/05 18:30';`,
`  const MOCK_EXAM_LABEL = '模擬試験-2026年5月実施ベネッセ共通テスト模試';
  const KAWAI_EXAM_ID = 'mock-kawai-zento-2026-02';
  const KAWAI_EXAM_LABEL = '模擬試験-第２回 河合全統共通テスト模試';
  const UPDATE_TIME_TEXT = '最終更新日時：2026/7/26 23:59';`,
      '模試定義');

    html = replaceRequired(html,
      "html = html.replace(/<b>バージョン：v\\d+<\\/b>/, '<b>バージョン：v182</b>');",
      "html = html.replace(/<b>バージョン：v\\d+<\\/b>/, '<b>バージョン：v184</b>');",
      'バージョン定義');

    html = replaceRequired(html,
`      "const STORAGE='ct-marker-keys-v8'; const USER_STORAGE='ct-marker-user-answers-v1'; const examLabel={main:'本試験',retake:'追試験・再試験',other:'試作問題','center-main':'本試験（センター）','center-retake':'追試験（センター）','" + MOCK_EXAM_ID + "':'" + MOCK_EXAM_LABEL + "'};"`,
`      "const STORAGE='ct-marker-keys-v8'; const USER_STORAGE='ct-marker-user-answers-v1'; const examLabel={main:'本試験',retake:'追試験・再試験',other:'試作問題','center-main':'本試験（センター）','center-retake':'追試験（センター）','" + MOCK_EXAM_ID + "':'" + MOCK_EXAM_LABEL + "','" + KAWAI_EXAM_ID + "':'" + KAWAI_EXAM_LABEL + "'};"`,
      '試験区分表示定義');

    html = replaceRequired(html,
`    const oldInit = "async function init(){const res=await fetch('answer_keys_verified.json',{cache:'no-store'});const obj=await res.json();BASE_KEYS=obj.keys||[];try{const sres=await fetch('statistics_final.json',{cache:'no-store'});if(sres.ok)STAT_DATA=await sres.json();}catch(e){STAT_DATA={entries:[]};}refresh();}";
    // v179: 模試データは answer_keys_verified.json に統合済み。別JSONをfetchして実行時結合しない。
    if (!html.includes(oldInit)) throw new Error('index.html の init 関数を見つけられませんでした。');`,
`    const oldInit = "async function init(){const res=await fetch('answer_keys_verified.json',{cache:'no-store'});const obj=await res.json();BASE_KEYS=obj.keys||[];try{const sres=await fetch('statistics_final.json',{cache:'no-store'});if(sres.ok)STAT_DATA=await sres.json();}catch(e){STAT_DATA={entries:[]};}refresh();}";
    const newInit = "async function init(){const res=await fetch('answer_keys_verified.json',{cache:'no-store'});const obj=await res.json();BASE_KEYS=obj.keys||[];for(const file of ['answer_keys_mock_kawai_2026_02_english_info.json','answer_keys_mock_kawai_2026_02_geo_history.json','answer_keys_mock_kawai_2026_02_civics_combined.json','answer_keys_mock_kawai_2026_02_japanese.json','answer_keys_mock_kawai_2026_02_math1.json','answer_keys_mock_kawai_2026_02_math2.json','answer_keys_mock_kawai_2026_02_science_basic.json','answer_keys_mock_kawai_2026_02_science_advanced.json']){try{const mres=await fetch(file,{cache:'no-store'});if(mres.ok){const mobj=await mres.json();BASE_KEYS=BASE_KEYS.concat(mobj.keys||[]);}}catch(e){console.warn('Kawai mock answer data could not be loaded: '+file,e);}}const infoGroupLabels={Q2A:'第2問 A',Q2B:'第2問 B',Q4A:'第4問 A',Q4B:'第4問 B'};for(const k of BASE_KEYS){if(k.problemUrl&&k.problemUrl.startsWith('https://kyotsutest.vercel.app/test/'))k.problemUrl='https://kyotsu.org/test/'+k.problemUrl.slice('https://kyotsutest.vercel.app/test/'.length);if(k.exam==='mock-kawai-zento-2026-02'&&k.subject==='情報I'){for(const q of (k.questions||[])){if(infoGroupLabels[q.group])q.group=infoGroupLabels[q.group];}}}try{const sres=await fetch('statistics_final.json',{cache:'no-store'});if(sres.ok)STAT_DATA=await sres.json();}catch(e){STAT_DATA={entries:[]};}refresh();}";
    if (!html.includes(oldInit)) throw new Error('index.html の init 関数を見つけられませんでした。');
    html = html.replace(oldInit, newInit);`,
      '正解データ読込定義');

    return html;
  }

  fetch(CURRENT_WRAPPER_URL, {cache:'no-store'})
    .then(r => {if(!r.ok) throw new Error('current wrapper fetch failed: ' + r.status); return r.text();})
    .then(patchWrapper)
    .then(html => {document.open(); document.write(html); document.close();})
    .catch(err => fail('読み込みに失敗しました。\n' + err.message));
})();
</script>
</body>
</html>
