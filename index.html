<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>共通テスト・センター試験 自動採点</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:#f6f7fb;color:#1d2433}
.boot{max-width:720px;margin:48px auto;padding:20px;background:white;border:1px solid #d9deea;border-radius:16px;box-shadow:0 10px 24px rgba(22,34,64,.06)}
.err{white-space:pre-wrap;margin:20px;padding:16px;border-radius:12px;background:#0b1020;color:#e5e7eb;font-family:ui-monospace,Consolas,monospace}
</style>
</head>
<body>
<div class="boot"><h1>読み込み中</h1><p>正解データを読み込んでいます。</p></div>
<script>
(function(){
  'use strict';
  const SRC='https://raw.githubusercontent.com/aykuno/exam.kyoutu.selfcheck/43fde43c8481d97281a6bceed38db10a2fa63990/index.html';
  const UPDATE_TIME_TEXT='最終更新日時：2026/7/3 18:20';
  const MOCK_EXAM_ID='mock-benesse-2026-05';
  const MOCK_EXAM_LABEL='模擬試験-2026年5月実施ベネッセ共通テスト模試';
  function fail(e){
    const msg=(e&&e.stack)||String(e||'unknown error');
    document.body.innerHTML='<pre class="err">読み込みに失敗しました。\n\n'+msg.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</pre>';
  }
  function patch(html){
    html=html.replace(/最終更新日時：[^<]+/,UPDATE_TIME_TEXT);
    html=html.replace(/<b>バージョン：v\d+<\/b>/,'<b>バージョン：v183</b>');
    const oldLabel="const STORAGE='ct-marker-keys-v8'; const USER_STORAGE='ct-marker-user-answers-v1'; const examLabel={main:'本試験',retake:'追試験・再試験',other:'試作問題','center-main':'本試験（センター）','center-retake':'追試験（センター）'};";
    const newLabel="const STORAGE='ct-marker-keys-v8'; const USER_STORAGE='ct-marker-user-answers-v1'; const examLabel={main:'本試験',retake:'追試験・再試験',other:'試作問題','center-main':'本試験（センター）','center-retake':'追試験（センター）','"+MOCK_EXAM_ID+"':'"+MOCK_EXAM_LABEL+"'};";
    if(html.includes(oldLabel)) html=html.replace(oldLabel,newLabel);
    if(!html.includes('pdf_export_v160.js')){
      html=html.replace('</body>','<script src="pdf_export_v160.js?v=183" defer><\/script></body>');
    }
    return html;
  }
  async function boot(){
    const ctl=new AbortController();
    const timer=setTimeout(()=>ctl.abort(),15000);
    try{
      const res=await fetch(SRC,{cache:'no-store',signal:ctl.signal});
      clearTimeout(timer);
      if(!res.ok) throw new Error('base index fetch failed: '+res.status+' '+res.statusText);
      const html=patch(await res.text());
      document.open();
      document.write(html);
      document.close();
    }catch(e){
      clearTimeout(timer);
      fail(e);
    }
  }
  boot();
})();
</script>
</body>
</html>
