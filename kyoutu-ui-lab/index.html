<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#ffffff">
  <title>共通テスト・センター試験 自動採点｜UI検証版</title>
  <link rel="stylesheet" href="style.css?v=20260803-photo2">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <button class="header-back" id="headerBack" type="button" hidden aria-label="前の画面へ戻る">‹</button>
      <button class="brand" id="brandHome" type="button">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>共通テスト・センター試験 自動採点</span>
      </button>
      <span class="lab-badge">検証版</span>
    </div>
  </header>

  <main>
    <nav class="steps" aria-label="採点の手順">
      <div class="step active" data-step="1"><span>1</span><b>試験を選ぶ</b></div>
      <div class="step" data-step="2"><span>2</span><b>解答を入力</b></div>
      <div class="step" data-step="3"><span>3</span><b>採点結果</b></div>
    </nav>

    <section class="screen home-screen" id="homeScreen">
      <div class="page-heading">
        <p class="eyebrow">メインサイトとは別のUI検証版</p>
        <h1>試験を選ぶ</h1>
        <p>2025年度本試験と2026年度第2回河合全統共通テスト模試の実データで動作します。</p>
      </div>

      <article class="resume-card" id="resumeCard" hidden>
        <div>
          <span class="resume-label">前回の続きから</span>
          <strong id="resumeSubject"></strong>
          <p id="resumeMeta"></p>
          <div class="mini-progress"><span id="resumeBar"></span></div>
        </div>
        <button class="primary-button" id="resumeButton" type="button">入力を再開</button>
      </article>

      <section class="selection-card">
        <h2>番号を入力して採点</h2>
        <div class="select-grid">
          <label>年度
            <select id="yearSelect" disabled><option>読み込み中...</option></select>
          </label>
          <label>試験
            <select id="examSelect" disabled><option>読み込み中...</option></select>
          </label>
          <label>科目
            <select id="subjectSelect" disabled><option>読み込み中...</option></select>
          </label>
        </div>
        <div class="subject-preview" id="subjectPreview">
          <div>
            <strong id="previewSubject">正解データを読み込んでいます</strong>
            <span id="previewMeta"></span>
          </div>
          <div class="source-links" id="sourceLinks"></div>
        </div>
        <div class="selection-footer">
          <p><span id="questionCount">—項目</span><span id="maxScore">—点</span><span>端末内に自動保存</span></p>
          <button class="primary-button" id="startButton" type="button" disabled>この科目で番号を入力</button>
        </div>
      </section>
      <section class="photo-entry-card">
        <div class="photo-entry-icon" aria-hidden="true">▣</div>
        <div class="photo-entry-copy">
          <span class="photo-entry-label">未登録の模試・試験にも対応</span>
          <h2>答案用紙と解答を撮影して採点</h2>
          <p>答案用紙を撮影して読取番号を確認した後、解答・配点一覧を撮影します。登録済みの正解データは使いません。</p>
        </div>
        <a class="photo-entry-button" href="photo/">カメラ採点を開く</a>
      </section>
      <p class="load-error" id="loadError" hidden></p>
    </section>

    <section class="screen entry-screen" id="entryScreen" hidden>
      <button class="inline-back" id="backToSelection" type="button">‹ 試験・科目選択へ戻る</button>
      <div class="entry-heading">
        <div>
          <p id="entryExam"></p>
          <h1 id="entrySubject"></h1>
        </div>
        <div class="progress-box">
          <p><span>入力</span><b id="entryProgressText"></b></p>
          <div class="progress-track"><span id="entryProgressBar"></span></div>
        </div>
      </div>

      <div class="entry-layout">
        <section class="answer-workspace">
          <div class="group-tabs" id="groupTabs" aria-label="大問を選ぶ"></div>
          <div class="group-heading">
            <h2 id="groupHeading"></h2>
            <span id="groupProgress"></span>
          </div>
          <div class="answer-grid" id="answerGrid"></div>
          <div class="group-move">
            <button type="button" id="prevGroup">‹ 前の大問</button>
            <button type="button" id="nextGroup">次の大問 ›</button>
          </div>
          <details class="test-tools">
            <summary>検証用メニュー</summary>
            <button type="button" id="fillCheckAnswers">正解を一部入力して結果を確認</button>
            <button type="button" id="clearAllAnswers">この科目の入力をすべて消す</button>
          </details>
        </section>

        <aside class="keypad" id="keypad" aria-label="解答入力キー">
          <div class="keypad-current">
            <div><span>選択中</span><b id="currentQuestion"></b></div>
            <strong id="currentAnswer">未入力</strong>
          </div>
          <div class="number-keys" id="numberKeys"></div>
          <div class="letter-keys" id="letterKeys" hidden></div>
          <div class="keypad-nav">
            <button type="button" id="previousField">前の欄</button>
            <button type="button" id="nextBlank">次の未入力</button>
          </div>
          <button class="grade-button" id="gradeButton" type="button">採点する</button>
          <p class="save-status"><i></i>この端末に自動保存済み</p>
        </aside>
      </div>
    </section>

    <section class="screen result-screen" id="resultScreen" hidden>
      <div id="result"></div>
    </section>
  </main>

  <div class="modal-layer" id="missingModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="missingTitle">
      <h2 id="missingTitle">未入力の項目があります</h2>
      <p id="missingMessage"></p>
      <div class="modal-actions">
        <button type="button" id="returnToEntry">入力へ戻る</button>
        <button class="primary-button" type="button" id="scoreAnyway">未入力を0点として採点</button>
      </div>
    </div>
  </div>

  <script src="app.js?v=20260803-photo2"></script>
  <script src="pdf-export.js?v=20260803-photo2"></script>
</body>
</html>
