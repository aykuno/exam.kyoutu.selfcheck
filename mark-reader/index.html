<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>マークシート自動読取</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <p class="eyebrow">共テ・センター自動採点サイト</p>
    <h1>マークシート自動読取</h1>
    <span class="badge">実験版 v2</span>
  </header>

  <main>
    <section class="notice">
      <strong>黒鉛筆で記入した指定様式の用紙を、全体が入るように撮影してください。</strong>
      <span>画像は端末内だけで処理され、外部には送信されません。</span>
    </section>

    <section class="card action-card">
      <label class="camera-button">
        <span class="camera-icon" aria-hidden="true">▣</span>
        撮影する・写真を選ぶ
        <input id="fileInput" type="file" accept="image/*" capture="environment">
      </label>
      <p>四隅指定・位置合わせ・感度調整は不要です。</p>
    </section>

    <section id="workingCard" class="card hidden" aria-live="polite">
      <div class="spinner"></div>
      <h2>自動で読み取っています</h2>
      <p id="workingText">用紙の基準マークを探しています…</p>
    </section>

    <section id="errorCard" class="card error hidden" aria-live="assertive">
      <h2>読み取れませんでした</h2>
      <p id="errorText"></p>
      <label class="retry-button">撮り直す<input type="file" accept="image/*" capture="environment"></label>
    </section>

    <section id="resultCard" class="card hidden">
      <div class="result-head">
        <div>
          <h2>読取結果</h2>
          <p id="summary"></p>
        </div>
        <button id="rescanButton" class="secondary" type="button">別の写真を読む</button>
      </div>
      <div class="legend"><span class="ok-dot"></span>読取済み <span class="warn-dot"></span>要確認 <span class="blank-dot"></span>未記入</div>
      <div id="results" class="results"></div>
      <button id="copyButton" class="primary" type="button">確認した解答番号をコピー</button>
      <p id="copyStatus" class="copy-status"></p>
      <details>
        <summary>検出画像を確認</summary>
        <canvas id="previewCanvas"></canvas>
      </details>
    </section>
  </main>

  <script src="./reader.js"></script>
</body>
</html>
